<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>花蓮建地待售彙整</title>
<style>
:root{
  --bg:#f4f6f3;--surface:#fff;--ink:#1c2420;--muted:#5b6862;--line:#dde3de;
  --brand:#1d6b51;--brand-ink:#fff;--chip:#e6ede8;
  --new:#0070C0;--drop:#D00000;--drop-bg:rgba(208,0,0,.09);--shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111614;--surface:#1a211e;--ink:#e8eeea;--muted:#9aa8a1;--line:#2c3732;
    --brand:#4cc29b;--brand-ink:#0a1612;--chip:#25302b;
    --new:#5aaaf2;--drop:#ff7d74;--drop-bg:rgba(255,125,116,.14);--shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow-wrap:anywhere;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
.wrap{
  max-width:1440px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}
.hd{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:8px}
h1{margin:0;font-size:20px;line-height:1.3}
.meta{margin-top:2px;font-size:13px;color:var(--muted)}

.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;
}
.chip span{margin-left:4px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.chip[aria-pressed="true"] span{color:inherit;opacity:.85}

.ctl{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px}
.ctl input[type=search],.ctl select{
  height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);
  font:inherit;font-size:16px;padding:0 12px;
}
.ctl input[type=search]{flex:1 1 220px;min-width:0;-webkit-appearance:none;appearance:none}
.ctl select{flex:0 0 auto;max-width:100%}
.tg,.seg button{
  height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:15px;cursor:pointer;
}
.tg{border-radius:10px}
.tg.drop{color:var(--drop)}
.tg.new{color:var(--new)}
.tg span{margin-left:4px;font-size:13px;opacity:.85}
.tg.drop[aria-pressed="true"]{background:var(--drop);border-color:var(--drop);color:#fff;font-weight:700}
.tg.new[aria-pressed="true"]{background:var(--new);border-color:var(--new);color:#fff;font-weight:700}
.seg{display:flex}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.count{padding:6px 0 10px;font-size:13px;color:var(--muted)}

.tag{font-weight:800;margin-right:3px}
.tag.new{color:var(--new)}
.tag.drop{color:var(--drop)}
.dn{
  display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:3px 10px;border-radius:8px;
  background:var(--drop-bg);color:var(--drop);font-weight:700;font-size:14px;
}
.dn .rng{font-weight:500;font-size:13px}
a.tel{color:var(--brand);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:16px}
.grp{grid-column:1/-1;margin:12px 0 0;font-size:17px;display:flex;align-items:baseline;gap:8px}
.grp span{font-size:13px;font-weight:400;color:var(--muted)}
.card{
  display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
}
.c-top{display:flex;align-items:baseline;gap:8px}
.no{flex:0 0 auto;font-weight:700;color:var(--muted);white-space:nowrap}
.card h3{margin:0;font-size:16px;line-height:1.4}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.price .p{font-size:28px;font-weight:800;line-height:1.2;color:var(--brand)}
.price .p small{margin-left:2px;font-size:14px;font-weight:600}
.price .s{font-size:14px;color:var(--muted)}
.card .dn{align-self:flex-start}
.kv{display:grid;grid-template-columns:3em 1fr;gap:3px 8px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.ag{padding:1px 0}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;
  border:1px solid var(--brand);color:var(--brand);text-decoration:none;font-weight:600;font-size:15px;
}
.btn.fill{background:var(--brand);color:var(--brand-ink)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
table{width:100%;min-width:1040px;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--chip);font-size:13px;white-space:nowrap}
th:nth-child(1){min-width:48px}th:nth-child(2){min-width:170px;width:20%}th:nth-child(3){min-width:130px}
th:nth-child(4){min-width:76px}th:nth-child(5){min-width:70px}th:nth-child(6){min-width:84px}
th:nth-child(7){min-width:120px;width:13%}th:nth-child(8){min-width:170px;width:18%}th:nth-child(9){min-width:70px}th:nth-child(10){min-width:100px}
td.n,th.n{text-align:right}
td.n{white-space:nowrap}
td.no2{white-space:nowrap;font-weight:700}
td.nt .dn{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;white-space:nowrap}
tr.g td{background:var(--chip);font-weight:700}
tr:last-child td{border-bottom:0}
@media (min-width:1100px){
  .tablewrap{overflow:visible}
  th{position:sticky;top:var(--barh,56px);z-index:2}
}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.top{
  position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));
  width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);
  font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;
}
.top.show{opacity:1;pointer-events:auto}
</style>
</head>
